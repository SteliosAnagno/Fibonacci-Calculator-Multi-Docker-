name: Deploy Fibonacci Calculator
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CheckoutCode
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Run CLient Tests  
        run: |
          docker build -t sanagno/react-test -f ./client/Dockerfile.dev ./client
          docker run -e CI=true sanagno/react-test npm test -- --coverage
      - name: Build Docker Images
        run: |
          docker build -t sanagno/multi-client:latest ./client
          docker build -t sanagno/multi-server:latest ./server
          docker build -t sanagno/multi-worker:latest ./worker
          docker build -t sanagno/multi-nginx:latest ./nginx

      - name: Push Docker Images
        run: |
          docker push sanagno/multi-client:latest
          docker push sanagno/multi-server:latest
          docker push sanagno/multi-worker:latest
          docker push sanagno/multi-nginx:latest
 
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
 
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: Fibonacci-multi-container-example
          environment_name: Fibonacci-multi-container-exampl-env 
          existing_bucket_name: elasticbeanstalk-eu-north-1-721030877384
          region: eu-north-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip